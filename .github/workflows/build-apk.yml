name: Build DeScraft Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Extract DeScraft project
        run: |
          base64 --decode bootstrap/descraftrts.tar.xz.b64 | tar -xJ
          python3 tools/check_data.py
          # Fix the Compose saveable import in the v0.1.0 source bundle.
          sed -i 's|import androidx.compose.saveable.rememberSaveable|import androidx.compose.runtime.saveable.rememberSaveable|' app/src/main/java/com/descraftrts/app/MainActivity.kt
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK and install API 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -x "$SDKMANAGER"
          echo "Using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Publish APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeScraft-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
